{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="pastel-card p-5 floating">
            <div class="text-center mb-4">
                <i class="fas fa-key fa-3x mb-3" style="color: var(--pastel-purple);"></i>
                <h2 style="background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                    Welcome Back! 🌈
                </h2>
                <p class="text-muted">Sign in to your Pastel Pages account</p>
            </div>

            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label" style="color: var(--text-dark);">Username</label>
                    <input type="text" name="username" class="form-control search-bar" placeholder="Enter your username" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label" style="color: var(--text-dark);">Password</label>
                    <input type="password" name="password" class="form-control search-bar" placeholder="Enter your password" required>
                </div>

                {% if form.errors %}
                <div class="alert" style="background: rgba(255, 209, 220, 0.3); border: 2px solid var(--pastel-pink); color: var(--text-dark); border-radius: 15px; padding: 15px;">
                    Please enter a correct username and password.
                </div>
                {% endif %}

                <button type="submit" class="btn btn-pastel btn-lg w-100 mb-3">Sign In 🎀</button>
                
                <div class="text-center">
                    <p class="text-muted">
                        Don't have an account? 
                        <a href="#" style="color: var(--pastel-purple); text-decoration: none;">Contact admin</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
